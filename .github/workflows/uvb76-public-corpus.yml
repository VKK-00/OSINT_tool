name: UVB-76 public corpus snapshot

on:
  push:
    branches:
      - uvb76-corpus-run-20260904
    paths:
      - .github/workflows/uvb76-public-corpus.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded dependencies
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0

      - name: Snapshot Priyom pages and archival mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot/priyom_pages
          git clone --depth 1 https://github.com/NatanaelAntonioli/UVB-76-Estudo.git snapshot/github_mirror
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          BASE = "https://priyom.org"
          INDEX = f"{BASE}/military-stations/russia/the-buzzer"
          OUT = Path("snapshot/priyom_pages")
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; public-UVB76-research-snapshot/1.0)",
              "Accept-Language": "en",
          })
          session.mount("https://", HTTPAdapter(max_retries=Retry(
              total=5,
              connect=5,
              read=5,
              backoff_factor=0.8,
              status_forcelist=(429, 500, 502, 503, 504),
              allowed_methods=frozenset(["GET", "HEAD"]),
          )))

          def get(url: str) -> requests.Response:
              response = session.get(url, timeout=45)
              response.raise_for_status()
              return response

          index_response = get(INDEX)
          index_body = index_response.content
          (OUT / "station_index.html").write_bytes(index_body)
          soup = BeautifulSoup(index_body, "lxml")
          urls = set()
          prefix = INDEX + "/"
          for anchor in soup.find_all("a", href=True):
              url = urljoin(INDEX, anchor["href"]).split("#", 1)[0].rstrip("/")
              if not url.startswith(prefix):
                  continue
              tail = url[len(prefix):]
              if re.fullmatch(r"pre2010|20\d{2}(?:/[a-z]+)?", tail):
                  urls.add(url)

          rows = [{
              "url": INDEX,
              "file": "station_index.html",
              "status": index_response.status_code,
              "bytes": len(index_body),
              "sha256": hashlib.sha256(index_body).hexdigest(),
          }]
          for sequence, url in enumerate(sorted(urls), start=1):
              tail = url[len(prefix):].replace("/", "__")
              filename = f"{tail}.html"
              try:
                  response = get(url)
                  body = response.content
                  (OUT / filename).write_bytes(body)
                  rows.append({
                      "sequence": sequence,
                      "url": url,
                      "file": filename,
                      "status": response.status_code,
                      "bytes": len(body),
                      "sha256": hashlib.sha256(body).hexdigest(),
                  })
              except Exception as exc:
                  rows.append({
                      "sequence": sequence,
                      "url": url,
                      "file": filename,
                      "status": None,
                      "error": f"{type(exc).__name__}: {exc}",
                  })
              time.sleep(0.2)

          summary = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "station_index": INDEX,
              "discovered_activity_urls": len(urls),
              "successful_pages_including_index": sum(not row.get("error") for row in rows),
              "failed_pages": sum(bool(row.get("error")) for row in rows),
          }
          (Path("snapshot") / "fetch_inventory.json").write_text(
              json.dumps({"summary": summary, "pages": rows}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
          tar -cJf uvb76_public_snapshot.tar.xz snapshot

      - name: Upload raw public corpus snapshot
        uses: actions/upload-artifact@v4
        with:
          name: uvb76-public-snapshot-20260904
          path: |
            snapshot/
            uvb76_public_snapshot.tar.xz
          if-no-files-found: error
          retention-days: 7
