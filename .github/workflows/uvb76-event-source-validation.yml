name: UVB-76 event source validation

on:
  push:
    branches:
      - uvb76-corpus-run-20260904
    paths:
      - '.github/workflows/uvb76-event-source-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate public source URLs
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, time
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          urls = [
            ('NATO strategic exercises topic','https://www.nato.int/cps/en/natohq/topics_111767.htm'),
            ('NATO Zapad 2017','https://www.nato.int/cps/en/natohq/news_146636.htm'),
            ('NATO Vostok 2018 review','https://www.nato.int/docu/review/articles/2018/12/20/russias-vostok-2018-exercise-and-the-changing-nature-of-russian-military-exercises/index.html'),
            ('NATO Zapad 2021','https://www.nato.int/cps/en/natohq/news_186945.htm'),
            ('Kremlin 2022-02-24','http://en.kremlin.ru/events/president/news/67843'),
            ('Kremlin 2022-09-21','http://en.kremlin.ru/events/president/news/69390'),
            ('Kremlin 2022-09-30','http://en.kremlin.ru/events/president/news/69465'),
            ('Kremlin 2023-06-24','http://en.kremlin.ru/events/president/news/71496'),
          ]
          session=requests.Session()
          session.headers['User-Agent']='Mozilla/5.0 UVB76-public-research-source-validator/1.0'
          rows=[]
          for label,url in urls:
            try:
              r=session.get(url,timeout=40,allow_redirects=True)
              soup=BeautifulSoup(r.text,'html.parser')
              title=soup.title.get_text(' ',strip=True) if soup.title else ''
              body=' '.join(soup.get_text(' ',strip=True).split())[:2000]
              rows.append({'label':label,'requested_url':url,'status_code':r.status_code,'final_url':r.url,'title':title,'body_excerpt':body,'bytes':len(r.content),'error':''})
            except Exception as exc:
              rows.append({'label':label,'requested_url':url,'status_code':'','final_url':'','title':'','body_excerpt':'','bytes':0,'error':f'{type(exc).__name__}: {exc}'})
            time.sleep(.5)
          out=Path('event_source_validation')
          out.mkdir(exist_ok=True)
          (out/'event_source_validation.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          with (out/'event_source_validation.csv').open('w',newline='',encoding='utf-8-sig') as f:
            w=csv.DictWriter(f,fieldnames=rows[0].keys());w.writeheader();w.writerows(rows)
          # Fail only if every source failed; individual failures are part of the result.
          assert any(str(x['status_code']).startswith('2') for x in rows), rows
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uvb76-event-source-validation-20260904
          path: event_source_validation
          if-no-files-found: error
          retention-days: 7
