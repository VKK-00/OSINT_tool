name: snapshots
on:
  schedule:
    - cron: "0 6 1 * *"   # monthly, 1st day 06:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh bundled datasets
        run: python scripts/update_snapshots.py
      - name: Verify loaders still pass
        run: |
          pip install pytest
          python -m pytest tests/test_engine.py::EngineTests::test_username_site_dataset_imports_maigret_resource tests/test_smoke.py -q
      - name: Open PR when upstream changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh bundled username datasets from upstream"
          title: "Refresh bundled username datasets"
          body: |
            Automated monthly refresh of Sherlock / WhatsMyName / Maigret bundled
            snapshots via `scripts/update_snapshots.py`.
            
            Review the dataset-count diff in the job log and the THIRD_PARTY_NOTICES
            commit bumps before merging.
          branch: auto/dataset-refresh
          delete-branch: true
