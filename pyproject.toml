[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-toolkit"
version = "0.3.0"
description = "Case-centric OSINT workbench: unified engine, evidence graph and UA/RF public-source coverage"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Volodymyr Ksienich" }
]
dependencies = [
  "httpx>=0.27",
  "pillow>=10.0",
  "phonenumbers>=8.13",
  "rich>=13.0",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
all = [
  "osint-toolkit[web,dev]",
]

[project.scripts]
osint-toolkit = "osint_toolkit.cli:main"
osintkit = "osintkit.__main__:main"
osintkit-web = "osintkit.webapp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E501",  # long lines are common in generated report/docstrings
]

[tool.setuptools.packages.find]
where = ["."]
include = ["osint_toolkit*", "osintkit*"]

[tool.setuptools.package-data]
osint_toolkit = ["resources/*.json", "resources/*.txt"]
