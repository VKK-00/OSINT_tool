[project]
name = "osintkit"
version = "0.1.0"
description = "Modular OSINT toolkit focused on UA/RF research targets"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "phonenumbers>=8.13",
  "rich>=13.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
osintkit = "osintkit.__main__:main"
osintkit-web = "osintkit.webapp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["osintkit*"]
