[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-toolkit"
version = "0.1.0"
description = "Local OSINT catalog navigator based on a curated GitHub OSINT snapshot"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Volodymyr Ksienich" }
]
dependencies = [
  "httpx>=0.27",
  "pillow>=10.0",
]

[project.scripts]
osint-toolkit = "osint_toolkit.cli:main"
osintkit = "osintkit.__main__:main"
osintkit-web = "osintkit.webapp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["osint_toolkit*", "osintkit*"]

[tool.setuptools.package-data]
osint_toolkit = ["resources/*.json", "resources/*.txt"]
